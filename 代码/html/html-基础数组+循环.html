<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>循环画格子</title>

  <style>
    /* ==========================================================
       CSS 部分
       ========================================================== */
    body {
      margin: 0;
      /* ↑ 去掉浏览器默认的 8px 边距 */
      background: #111;
      /* ↑ 深灰背景 */
      display: flex;
      /* ↑ 开启弹性布局。⚠️ 拼写是 flex，不是 fles！f-l-e-x */
      justify-content: center;
      /* ↑ flex 主轴居中（column 时是垂直，row 时是水平） */
      align-items: center;
      /* ↑ flex 交叉轴居中 */
      min-height: 100vh;
      /* ↑ 高度至少占满一屏，否则居中看不出来 */
    }

    #cv {
      border-radius: 8px;
      /* ↑ 圆角 8px */
    }
  </style>
</head>

<body>
  <canvas id="cv"></canvas>
  <!-- ↑ 画布，id="cv" 供 JS 查找 -->
  <script>
    // ==========================================================
    // JS 部分
    // ==========================================================

    // ---------- 1. 初始化画布 ----------
    const cv = document.getElementById('cv');
    // ↑ 找到 id="cv" 的 canvas 元素
    cv.width = 400;
    cv.height = 400;
    // ↑ 设置画布的"分辨率"（属性，不是 CSS 的 width）
    const ctx = cv.getContext('2d');
    // ↑ 获取 2D 画笔，后续所有绘制都靠它

    // ---------- 2. 铺背景 ----------
    ctx.fillStyle = 'pink';
    // ↑ 填充色：粉色
    ctx.fillRect(0, 0, 400, 400);
    // ↑ 从 (0,0) 画一个 400×400 的实心矩形 = 铺满整块画布

    // ---------- 3. 用循环画 10×10 个格子 ----------
    const N = 10;
    // ↑ 格子数量：10 行 10 列
    const cs = 40;
    // ↑ 每格边长 40px（400 / 10 = 40）

    for (let i = 0; i < N * N; i++) {
      // ↑ 循环 100 次（i 从 0 到 99）
      //   一个格子一个编号 i，从 0 到 N*N-1
      // ⚠️ 不要写成 i < 10，那样只画 10 个格子

      // ===== 编号 → 行列 =====
      const r = Math.floor(i / N);
      // ↑ 行号 r：i 整除 N
      //   例 i=23, N=10: Math.floor(23/10) = 2（第 2 行，从 0 算起）

      const c = i % N;
      // ↑ 列号 c：i 除以 N 的余数
      //   例 i=23, N=10: 23 % 10 = 3（第 3 列）

      // ===== 行列 → 像素坐标 =====
      const x = c * cs;
      // ↑ x 由「列」决定（c → x，因为列是水平的）
      const y = r * cs;
      // ↑ y 由「行」决定（r → y，因为行是垂直的）
      // ⚠️ 千万不要写成 y = c * cs！两个都用 c 的话，同一行的所有格子会重叠在一起
      //得到的(x,y)就是在画布上的坐标

      // ===== 每格随机颜色 =====
      const lightness = 40 + Math.random() * 40;
      // ↑ 亮度随机：20~60
      //   Math.random() 返回 0~1 之间的随机小数

      ctx.fillStyle = `hsl(0, 10%, ${lightness}%)`;
      // ↑ ⚠️ 使用「模板字符串」（反引号 ` 包起来的字符串），
      //   ${lightness} 会被替换成变量 lightness 的值
      //  hsl(色相, 饱和度%, 亮度%)
      //例：hsl(30, 10%, 40%) = 颜色：深黄，饱和度 10%，亮度 40%

      ctx.fillRect(x, y, cs, cs);
      // ↑ 画一个实心格子

      // ===== 边框 =====
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      //rgba(0,0,0,0.3) -> 颜色：黑色，透明度 0.3
      // ↑ 描边色：半透明黑色

      ctx.lineWidth = 2;
      // ↑ 线宽 1px

      ctx.strokeRect(x + 0.5, y + 0.5, cs - 1, cs - 1);
      // ↑ 画空心矩形（边框）
      //   x+0.5, y+0.5 和宽高-1 是为了「像素对齐」：
      //   1px 的线如果画在整像素上会模糊，+0.5 偏移让线条清晰
      //为什么 +0.5：canvas 画 1px 的线时，如果线在整像素（如 x=40），
      //浏览器会把线分到两个像素上,看起来模糊。
      //偏移 0.5让线精确落在 1 个像素上，清晰锐利。
      //宽高 -1：因为边框要画在格子的内侧，否则相邻格子的边框会重叠。
    }
  </script>
</body>
</html>
