<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>常用样式</title>
    <style>
        .box {
            /* 设置字体大小 */
            font-size: 20px;
            /* 设置字体族，如果电脑没有第一个字体则使用第二个 */
            font-family: "Microsoft YaHei", Arial, sans-serif;
            /* 设置字体颜色 */
            color: #333333;
            /* 设置文本水平居中 */
            text-align: center;
            /* 设置背景颜色 */
            background-color: #f0f0f0;
            /* 设置文本装饰，none 可以去掉链接默认的下划线 */
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">这是一个样式盒子</div>
</body>
</html>
