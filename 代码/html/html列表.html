<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>列表</title>
</head>
<body>
    <h3>有序列表</h3>
    <!-- <ol> (Ordered List) 定义有序列表，浏览器会自动加上 1. 2. 3. 编号 -->
    <ol>
        <!-- <li> (List Item) 定义列表项 -->
        <li>我是有序列表</li>
        <li>我是有序列表</li>
        <li>我是有序列表</li>
        <li>我是有序列表</li>
    </ol>
    <h3>无序列表</h3>
    <!-- <ul> (Unordered List) 定义无序列表，浏览器会自动加上圆点符号 -->
    <ul>
        <li>我是无序列表</li>
        <li>我是无序列表</li>
        <li>我是无序列表</li>
        <li>我是无序列表</li>
    </ul>
</body>
</html>
