<!DOCTYPE html>
<!-- 根标签，声明网页语言为英语 -->
<html lang="en">
<!-- <head> 包含网页的元数据 -->
<head>
    <!-- 字符编码设为 UTF-8，防止中文乱码 -->
    <meta charset="utf-8">
    <!-- 网页标题，显示在浏览器标签页上 -->
    <title>第一个JavaScript程序</title>
</head>
<!-- <body> 包含网页可见内容 -->
<body>
    <!-- 一级标题 -->
    <h1>我的第一个 JavaScript</h1>

    <!-- <button> 标签定义按钮 -->
    <!-- type="button" 表示这是一个普通按钮（不是提交按钮） -->
    <!-- onclick="alert('欢迎')" 是核心：当用户点击按钮时，触发引号里的 JavaScript 代码 -->
    <!-- alert('欢迎') 是调用浏览器内置的弹窗函数，显示“欢迎”两个字 -->
    <button type="button" onclick="alert('欢迎')">点击此处</button>
</body>
</html>
