<!-- <!DOCTYPE html> 声明文档类型，告诉浏览器这是一个 HTML5 文档，必须放在第一行 -->
<!DOCTYPE html>
<!-- <html> 是根标签，lang="en" 告诉浏览器网页语言是英语（en），方便浏览器翻译或语音合成 -->
<html lang="en">
<!-- <head> 包含网页的元数据（不可见部分），如编码、标题、引入的CSS样式等 -->
<head>
    <!-- <meta charset="UTF-8"> 设定字符编码为 UTF-8，防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- <title> 定义网页的标题，显示在浏览器标签页上 -->
    <title>认识html</title>
</head>
<!-- <body> 包含网页的主体内容，所有用户能看到的文字、图片都在这里面 -->
<body>
    <!-- 标题标签：<h1> 到 <h6>，字号依次变小，h1 最大，h6 最小 -->
    <h1>这是一级标题</h1>
    <h2>这是二级标题</h2>
    <h3>这是三级标题</h3>
    <h4>这是四级标题</h4>
    <h5>这是五级标题</h5>
    <h6>这是六级标题</h6>
    <!-- 段落标签：<p> 用于包裹一段文字，段与段之间自动换行并留有空隙 -->
    <p>这是一个段落标签</p>
    <!-- 超链接标签：<a>，href 属性是目标网址，点击后跳转 -->
    <a href="https://www.baidu.com">这是通往百度的地址</a>
    <!-- 图片标签：<img>，src 属性是图片地址，alt 是图片加载失败时显示的文字 -->
    <img src="https://ts1.cn.mm.bing.net/th/id/R-C.748160bf925a7acb3ba1c9514bbc60db" alt="示例图片">
</body>
<!-- </html> 结束根标签 -->
</html>
