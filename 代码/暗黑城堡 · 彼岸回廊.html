<!DOCTYPE html>
<html lang="zh">
<head>

<title>暗黑城堡 · 彼岸回廊</title>
<style>
:root{--bg1:#1a0f1f;--bg2:#08060c;--fg:#f0dde6;--card:rgba(24,14,30,.9);--ac:#ff3b5c;--btn:#2a1a30;--bd:#7a2a48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0f1f;--bg2:#08060c;--fg:#f0dde6;--card:rgba(24,14,30,.9);--ac:#ff3b5c;--btn:#2a1a30;--bd:#7a2a48}}
:root[data-theme="dark"]{--bg1:#1a0f1f;--bg2:#08060c;--fg:#f0dde6;--card:rgba(24,14,30,.9);--ac:#ff3b5c;--btn:#2a1a30;--bd:#7a2a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg);font:15px/1.5 "Hiragino Maru Gothic ProN","Yuanti SC","Microsoft YaHei",system-ui,sans-serif;text-align:center;padding:8px;user-select:none;-webkit-user-select:none}
#hud{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;align-items:center;max-width:820px;margin:0 auto 8px;padding:6px 10px;background:var(--card);border:2px solid var(--bd);border-radius:16px;font-size:14px}
#hud b{color:var(--ac)}
#hp{width:130px;height:14px;border:2px solid var(--bd);border-radius:9px;background:#1a0a10;overflow:hidden}
#hpf{display:block;height:100%;background:linear-gradient(90deg,#8f0f2a,#ff3b5c);transition:width .25s;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
button{background:var(--btn);color:var(--fg);border:2px solid var(--bd);border-radius:14px;padding:4px 12px;font-size:14px}
#wrap{position:relative;display:inline-block;line-height:0}
canvas{border-radius:18px;border:3px solid #3a1a2a;box-shadow:0 6px 34px rgba(160,20,50,.5)}
#rl{position:absolute;left:10px;top:8px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.5;color:#ff6b88;text-align:left;pointer-events:none;text-shadow:0 0 4px #000,0 0 8px #000}
#dlg{display:none;position:absolute;left:8px;right:8px;bottom:8px;padding:6px 12px;background:rgba(18,10,24,.88);border:2px solid #7a2a48;border-radius:14px;text-align:left;color:#f0dde6;font-size:14px;line-height:1.5;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#dn{background:#b3123a;color:#fff;font-size:12px;padding:1px 8px;border-radius:8px;margin-right:6px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);padding:16px;line-height:1.5;border-radius:18px}
#ov h2{font-size:28px;margin:0 0 2px;color:var(--ac);letter-spacing:.12em;text-shadow:0 2px 0 #000,0 0 18px #c0173f}
#ov small{color:var(--fg);opacity:.75;margin-bottom:10px}
#ov p{max-width:300px;margin:0 0 16px;font-size:14px}
#ob{font-size:17px;padding:8px 28px;background:linear-gradient(135deg,#c0173f,#7a0f2a);border:0;color:#fff;box-shadow:0 4px 0 #3d0715}
#rl{z-index:2}#dlg{z-index:3}#ov{z-index:5}
#ts{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;border-radius:18px;overflow:hidden;line-height:1.4;z-index:6;background:linear-gradient(180deg,#14040c 0%,#2a0a16 45%,#0a0408 100%)}
#ts .moon{position:absolute;left:50%;top:8%;width:36%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 40% 38%,#ff6a5a,#b3122e 60%,#5a0716);box-shadow:0 0 60px 20px rgba(200,20,50,.5);animation:moon 6s ease-in-out infinite alternate}
@keyframes moon{to{box-shadow:0 0 96px 38px rgba(230,30,60,.6)}}
#ts .castle{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%}
#ts .win rect{animation:wf 5s infinite}
#ts .win rect:nth-child(odd){animation-delay:-1.7s}#ts .win rect:nth-child(3n){animation-delay:-3.1s}
@keyframes wf{0%,100%{opacity:1}40%{opacity:.35}45%{opacity:1}70%{opacity:.6}}
#ts .fog{position:absolute;left:-50%;width:200%;height:30%;background:radial-gradient(ellipse at center,rgba(130,80,110,.38),transparent 70%);animation:drift 18s linear infinite}
#ts .f1{bottom:6%}#ts .f2{bottom:-4%;animation-duration:27s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(25%)}}
#ts .bat{position:absolute;left:-10%;font-size:20px;animation:fly 9s linear infinite}
@keyframes fly{0%{left:-10%;transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(8px)}75%{transform:translateY(-10px)}100%{left:110%;transform:translateY(0)}}
#ts .tt{position:relative;z-index:2;margin-top:7%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px}
#ts small{letter-spacing:.5em;color:#c9a46a;font-size:clamp(10px,2.2vw,14px)}
#ts h1{margin:0;font-family:Georgia,'Songti SC','STSong',serif;font-size:clamp(34px,9vw,68px);letter-spacing:.2em;color:#f3e3c3;text-shadow:0 0 12px #c0173f,0 0 36px #7a0f2a,0 3px 0 #000;animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.55}50%{opacity:1}72%{opacity:.85}74%{opacity:1}}
#ts .chs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#ts .chs span{font-size:12px;padding:2px 10px;border:1px solid #5a2a3a;border-radius:4px;color:#8a7080;background:rgba(0,0,0,.45)}
#ts .chs .on{color:#f3d9a0;border-color:#c9a46a;box-shadow:0 0 10px rgba(201,164,106,.5)}
#ts p{margin:2px 0 0;font-size:12px;color:#9a8090}
#tb{margin-top:6px;font-size:17px;padding:8px 30px;background:linear-gradient(135deg,#c0173f,#7a0f2a);border:0;color:#fff;box-shadow:0 4px 0 #3d0715;font-family:inherit;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #3d0715,0 0 20px #c0173f}}
#gate{position:absolute;inset:0;display:none;pointer-events:none;overflow:hidden;border-radius:18px;z-index:4}
#gate i{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#150b17 0 36px,#21101f 36px 38px);box-shadow:inset 0 0 50px #000;transition:transform 1.3s cubic-bezier(.7,0,.2,1)}
#gate i::before{content:'';position:absolute;left:0;right:0;top:22%;height:10px;background:#050205;box-shadow:0 0 0 2px #3a1a28,0 180px 0 0 #050205}
#gate i::after{content:'';position:absolute;top:48%;width:22px;height:22px;border-radius:50%;border:4px solid #7a5a2a;background:#0a0408}
#gate i:first-child{left:0;border-right:3px solid #4a1a2a}#gate i:first-child::after{right:10px}
#gate i:last-child{right:0;border-left:3px solid #4a1a2a}#gate i:last-child::after{left:10px}
#gate.open i:first-child{transform:translateX(-102%)}#gate.open i:last-child{transform:translateX(102%)}
#gcard{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:7;opacity:0;pointer-events:none;line-height:1.3}
#gc1{font-size:clamp(12px,2.6vw,16px);letter-spacing:.5em;color:#c9a46a}
#gc2{font-family:Georgia,'Songti SC',serif;font-size:clamp(26px,7vw,48px);letter-spacing:.2em;color:#f3e3c3;text-shadow:0 0 14px #c0173f,0 3px 0 #000}
#gcard.show{animation:card 2.4s ease forwards}
@keyframes card{0%{opacity:0;transform:scale(1.18)}18%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#clear{position:absolute;left:0;right:0;top:34%;display:none;flex-direction:column;align-items:center;z-index:8;pointer-events:none;line-height:1.25}
#clear::before,#clear::after{content:'';height:2px;width:0;background:linear-gradient(90deg,transparent,#ffd98a,transparent)}
#cl1{font-family:Georgia,serif;font-weight:bold;font-size:clamp(28px,8vw,56px);letter-spacing:.25em;background:linear-gradient(90deg,#8a6a2a,#fff1c0,#8a6a2a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,120,60,.7))}
#cl2{color:#ffd98a;letter-spacing:.35em;font-size:clamp(12px,3vw,16px);margin-top:4px}
#clear.go{animation:clr 2s ease forwards}
#clear.go::before,#clear.go::after{animation:ln 2s ease forwards}
#clear.go #cl1{animation:sw 2s linear forwards}
@keyframes clr{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
@keyframes ln{0%{width:0}25%{width:80%}100%{width:80%}}
@keyframes sw{from{background-position:200% 0}to{background-position:-100% 0}}
#pad{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:10px auto 0;touch-action:none}
#pad button{height:48px;font-size:20px;border-radius:50%;width:58px;touch-action:none}
</style>
</head>
<body>
<div id="hud">
  <b id="h1"></b><span id="h2"></span>
  <span>🩸</span><div id="hp"><i id="hpf"></i></div><span id="hpt"></span><span id="h3"></span>
  <button id="bs"></button><button id="bm">🔊</button>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <ul id="rl"></ul>
  <div id="dlg"><b id="dn">小葵</b><span id="dt"></span></div>
  <div id="ov"><h2 id="ot"></h2><small id="os"></small><p id="op"></p><button id="ob"></button></div>
  <div id="gate"><i></i><i></i></div>
  <div id="gcard"><div id="gc1"></div><div id="gc2"></div></div>
  <div id="clear"><div id="cl1">LEVEL CLEAR</div><div id="cl2"></div></div>
  <div id="ts">
    <div class='moon'></div>
    <span class='bat' style='top:14%'>🦇</span><span class='bat' style='top:26%;animation-delay:-3s;animation-duration:12s'>🦇</span><span class='bat' style='top:8%;animation-delay:-6s;animation-duration:7s'>🦇</span>
    <svg class='castle' viewBox='0 0 400 230' preserveAspectRatio='xMidYMax slice'>
      <g fill='#07030a'><rect x='70' y='140' width='260' height='90'/><rect x='155' y='80' width='90' height='150'/><polygon points='147,80 200,14 253,80'/><rect x='38' y='100' width='44' height='130'/><polygon points='32,100 60,48 88,100'/><rect x='318' y='100' width='44' height='130'/><polygon points='312,100 340,48 368,100'/><rect x='105' y='118' width='26' height='112'/><polygon points='101,118 118,84 135,118'/><rect x='269' y='118' width='26' height='112'/><polygon points='265,118 282,84 299,118'/><rect x='199' y='0' width='2' height='16'/></g>
      <path d='M70 136H330' stroke='#07030a' stroke-width='10' stroke-dasharray='10 8' fill='none'/>
      <g fill='#ffb347' class='win'><rect x='194' y='98' width='6' height='12'/><rect x='178' y='130' width='5' height='10'/><rect x='218' y='130' width='5' height='10'/><rect x='54' y='128' width='5' height='11'/><rect x='338' y='128' width='5' height='11'/><rect x='114' y='150' width='6' height='10'/><rect x='278' y='150' width='6' height='10'/><rect x='194' y='172' width='12' height='20' fill='#ff7a3a'/></g>
    </svg>
    <div class='fog f1'></div><div class='fog f2'></div>
    <div class='tt'>
      <small>CASTLE OF SHADOWS</small>
      <h1>暗黑城堡</h1>
      <div class='chs'><span class='on'>第一章 · 彼岸回廊</span><span>第二章 · 血月钟楼 🔒</span><span>第三章 · 幽魂地牢 🔒</span></div>
      <button id="tb">踏入城堡</button>
      <p>方向键 / WASD 移动 · R 键用 DFS 探路</p>
    </div>
  </div>
</div>
<div id="pad">
  <span></span><button data-k="u">↑</button><span></span>
  <button data-k="l">←</button><button data-k="d">↓</button><button data-k="r">→</button>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const D={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]};
const IT={heal:['🍓','……果实还带着温度。体力 +35'],shield:['🛡️','结界展开。6 秒内无惧撕咬'],speed:['👟','身体变轻了……疾跑 5 秒'],freeze:['❄️','时间凝固。怨灵们动弹不得'],scroll:['📜','古老的卷轴……探路 +1'],key:['🔑','血月钥匙……魔法阵苏醒了。']};
let N,EXIT,cs,size,dpr,adj,seen,seenP,litP,dist,tex,mazeCv,dk,dkx,pl,mons=[],items=[],parts=[],petals=[];
let hasKey=false,hp=100,hpKeep=100,invT=0,shieldT=0,speedT=0,freezeT=0,hurt=0,dlgT=0,lvl=1,state='title',steps=0,time=0,charges=3,routes=[],routeT=0,shake=0,danger=0,dDisp=0,hbT=0,dirs=[],muted=false,AC,master,face=1;

// ========== 图 / 算法 ==========
function nbrs(i){const r=i/N|0,c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o}
function link(a,b){adj[a].push(b);adj[b].push(a)}
// ① DFS 回溯栈生成完美迷宫（唯一通路）；extra>0 时多打通几面墙
function gen(extra){
  adj=Array.from({length:N*N},()=>[]);
  const vis=new Uint8Array(N*N),st=[0];vis[0]=1;
  while(st.length){const cur=st[st.length-1],c=nbrs(cur).filter(x=>!vis[x]);
    if(c.length){const n=c[Math.random()*c.length|0];link(cur,n);vis[n]=1;st.push(n)}else st.pop()}
  for(let t=0;extra>0&&t<800;t++){const a=Math.random()*N*N|0,o=nbrs(a),b=o[Math.random()*o.length|0];if(!adj[a].includes(b)){link(a,b);extra--}}
}
// ② DFS 回溯枚举全部简单路径，③ 按长度升序排序
function findRoutes(s,t){
  const res=[],path=[s],on=new Uint8Array(N*N);on[s]=1;
  (function dfs(u){if(res.length>=300)return;if(u===t){res.push(path.slice());return}
    for(const v of adj[u])if(!on[v]){on[v]=1;path.push(v);dfs(v);path.pop();on[v]=0}})(s);
  return res.sort((a,b)=>a.length-b.length);
}
function bfs(s){const d=new Int16Array(N*N).fill(-1),q=[s];d[s]=0;
  for(let h=0;h<q.length;h++){const u=q[h];for(const v of adj[u])if(d[v]<0){d[v]=d[u]+1;q.push(v)}}return d}

// ========== 音频（轻柔五声音阶）==========
function audio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
  const sc=[147,175,196,220,262,294];
  setInterval(()=>{if(!muted&&state==='play')tone(sc[Math.random()*sc.length|0]/(Math.random()<.4?2:1),1.4,'sine',.045)},650);
}
function tone(fr,dur,type,vol,slide){
  if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(fr,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+dur);
  g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(master);o.start();o.stop(n+dur);
}
const step=()=>tone(700+Math.random()*150,.06,'sine',.05,500);
const beat=()=>{tone(110,.15,'sine',.25,70);setTimeout(()=>tone(95,.15,'sine',.18,60),150)};
const bubble=()=>tone(300,.25,'sine',.15,700);

// ========== 关卡 ==========
const ctr=i=>[(i%N+.5)*cs,((i/N|0)+.5)*cs];
function pos(e){const a=ctr(e.c);if(e.to<0)return a;const b=ctr(e.to),t=e.t*e.t*(3-2*e.t);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function say(s,sec){$('dt').textContent=s;$('dlg').style.display='block';dlgT=sec||2.4}
function build(){
  const cssW=Math.min(innerWidth-16,innerHeight-200,820);
  N=Math.min(13+2*(lvl-1),25,Math.max(9,Math.floor(cssW/32)|1));EXIT=N*N-1;
  size=Math.max(264,Math.floor(cssW/N)*N);cs=size/N;dpr=Math.min(devicePixelRatio||1,2);
  cv.width=cv.height=size*dpr;cv.style.width=cv.style.height=size+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  dk=document.createElement('canvas');dk.width=dk.height=size*dpr;dkx=dk.getContext('2d');dkx.setTransform(dpr,0,0,dpr,0,0);
  gen(lvl===1?0:Math.min(lvl+1,8));
  tex=Array.from({length:N*N},Math.random);seen=new Uint8Array(N*N);seenP=new Path2D();
  pl={c:0,to:-1,t:0,dur:.16};face=1;
  mons=[];const nm=Math.min(3+lvl,9);
  while(mons.length<nm){const i=Math.random()*N*N|0;
    if((i/N|0)+i%N>=N-1&&i!==EXIT&&!mons.some(m=>m.c===i))mons.push({c:i,to:-1,t:0,prev:-1,mode:0,cd:Math.random(),stun:0})}
  items=[];const ty=['heal','heal','heal','shield','shield','speed','speed','freeze','scroll'];
  const ok=i=>i!==0&&i!==EXIT&&!items.some(o=>o.c===i)&&!mons.some(m=>m.c===i);
  while(items.length<Math.min(7+lvl,12)){const i=Math.random()*N*N|0;if(ok(i))items.push({c:i,k:ty[Math.random()*ty.length|0]})}
  const d0=bfs(0);let kc=0,tr=0;do{kc=Math.random()*N*N|0}while(tr++<800&&(!ok(kc)||d0[kc]<N));
  items.push({c:kc,k:'key'});
  petals=Array.from({length:36},()=>({x:Math.random()*size,y:Math.random()*size,vx:8+Math.random()*10,vy:12+Math.random()*14,r:Math.random()*6,vr:(Math.random()-.5)*3,s:3+Math.random()*3}));
  parts=[];routes=[];routeT=0;steps=0;time=0;charges=3;shake=0;dDisp=0;danger=0;hp=hpKeep;invT=shieldT=speedT=freezeT=hurt=0;hasKey=false;
  $('rl').textContent='';paintMaze();arrive();say('红月之下……回廊好安静。先找到血月钥匙。',3);
}
function paintMaze(){
  mazeCv=document.createElement('canvas');mazeCv.width=mazeCv.height=size*dpr;
  const g=mazeCv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  for(let i=0;i<N*N;i++){const r=i/N|0,c=i%N,x=c*cs,y=r*cs;
    g.fillStyle=(r+c)%2?`hsl(335,24%,${13+tex[i]*5}%)`:`hsl(270,18%,${10+tex[i]*5}%)`;g.fillRect(x,y,cs+.5,cs+.5);
    if(tex[i]>.86){g.fillStyle='#9c1230';for(let k=0;k<5;k++){const a=k*1.2566;g.beginPath();g.ellipse(x+cs*.5+Math.cos(a)*cs*.07,y+cs*.5+Math.sin(a)*cs*.07,cs*.06,cs*.035,a,0,7);g.fill()}
      g.fillStyle='#ff5a6e';g.beginPath();g.arc(x+cs*.5,y+cs*.5,cs*.03,0,7);g.fill()}}
  const W=()=>{g.beginPath();for(let i=0;i<N*N;i++){const r=i/N|0,c=i%N,x=c*cs,y=r*cs;
    if(r===0||!adj[i].includes(i-N)){g.moveTo(x,y);g.lineTo(x+cs,y)}
    if(c===0||!adj[i].includes(i-1)){g.moveTo(x,y);g.lineTo(x,y+cs)}
    if(r===N-1){g.moveTo(x,y+cs);g.lineTo(x+cs,y+cs)}
    if(c===N-1){g.moveTo(x+cs,y);g.lineTo(x+cs,y+cs)}}g.stroke()};
  g.lineCap='round';
  g.strokeStyle='#050308';g.lineWidth=cs*.26;W();
  g.strokeStyle='#3a2548';g.lineWidth=cs*.17;W();
  g.strokeStyle='#8a3a5c';g.lineWidth=cs*.05;W();
}
function arrive(){
  dist=bfs(pl.c);litP=new Path2D();
  for(let i=0;i<N*N;i++)if(dist[i]>=0&&dist[i]<=3){
    litP.rect(i%N*cs-1,(i/N|0)*cs-1,cs+2,cs+2);
    if(!seen[i]){seen[i]=1;seenP.rect(i%N*cs,(i/N|0)*cs,cs,cs)}}
  const ii=items.findIndex(o=>o.c===pl.c);
  if(ii>=0){const o=items.splice(ii,1)[0],[x,y]=ctr(o.c);
    burst(x,y,22,'255,200,60',90);tone(784,.25,'sine',.14,1175);say(IT[o.k][1],2.2);
    if(o.k==='heal')hp=Math.min(100,hp+35);else if(o.k==='shield')shieldT=6;else if(o.k==='speed')speedT=5;else if(o.k==='freeze')freezeT=4;else if(o.k==='key')hasKey=true;else charges++}
  if(pl.c===EXIT){if(hasKey)finish(true);else say('魔法阵被封印了……需要钥匙。',2)}
}

// ========== 流程 ==========
function showOv(t,s,p,b,fn){$('ot').textContent=t;$('os').textContent=s;$('op').textContent=p;$('ob').textContent=b;$('ob').onclick=()=>{audio();fn()};$('ov').style.display='flex'}
let introT=0,introK=1,winT=0;
const CH=['彼岸回廊','血月钟楼','幽魂地牢','深渊王座','终焉之间'];
// 入场：城门紧闭 → 层数字幕 → 巨门缓缓打开 → 灯光逐渐亮起
function entry(){
  const g=$('gate'),c=$('gcard');g.style.display='block';g.classList.remove('open');c.classList.remove('show');void g.offsetWidth;
  $('gc1').textContent='第 '+lvl+' 层';$('gc2').textContent=CH[(lvl-1)%CH.length];c.classList.add('show');
  setTimeout(()=>{g.classList.add('open');shake=.5;tone(70,1.3,'sawtooth',.25,35);const[x,y]=ctr(pl.c);burst(x,y,40,'255,90,60',140)},700);
  setTimeout(()=>{g.style.display='none'},2600);
}
// 通关：LEVEL CLEAR 金色横幅
function showClear(){const c=$('clear');$('cl2').textContent='第 '+lvl+' 层 · '+CH[(lvl-1)%CH.length]+' 通关';c.style.display='flex';c.classList.remove('go');void c.offsetWidth;c.classList.add('go');setTimeout(()=>{c.style.display='none'},2100)}
function start(){build();state='intro';introT=0;introK=.05;$('ov').style.display='none';entry()}
function finish(w){
  if(state!=='play')return;state=w?'win':'dead';
  const[x,y]=pos(pl);burst(x,y,w?60:30,w?'255,90,120':'140,20,50',w?150:100);
  let stars='',best='';
  if(w){const par=N*N*.35,st=1+(time<par)+(hp>=70);stars='★'.repeat(st)+'☆'.repeat(3-st);
    try{const k='az'+lvl,b=+localStorage.getItem(k)||1e9;if(time<b)localStorage.setItem(k,time.toFixed(1));best=' · 最佳 '+Math.min(b,time).toFixed(1)+' 秒'}catch(e){}
    [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.5,'triangle',.16),i*110));winT=0;showClear();tone(70,1.6,'sine',.45,40);{const[ex2,ey2]=ctr(EXIT);burst(ex2,ey2,90,'255,170,90',260)}say('……逃出来了。天亮之前，终于。',3)}
  else{tone(180,.8,'sine',.3,60);say('意识……在消散……',3)}
  setTimeout(()=>w?showOv('成功逃脱！','第 '+lvl+' 关 '+stars,'用时 '+time.toFixed(1)+' 秒，走了 '+steps+' 步'+best+'。下一层回廊更深，怨灵更多，体力回复 30。','继续深入',()=>{lvl++;hpKeep=Math.min(100,hp+30);start()})
                  :showOv('倒下了……','第 '+lvl+' 关','红月仍高悬。小葵还想再试一次……','再试一次',()=>{hpKeep=100;start()}),w?2600:1000);
}
function scout(){
  if(state!=='play'||charges<=0)return;charges--;
  routes=findRoutes(pl.c,EXIT);routeT=4;tone(660,.3,'sine',.14,990);
  const ul=$('rl');ul.textContent='';
  routes.slice(0,3).forEach((p,i)=>{const li=document.createElement('li');li.textContent='✧ 路线 '+(i+1)+' · '+(p.length-1)+' 步';ul.appendChild(li)});
  if(routes.length>3){const li=document.createElement('li');li.textContent='✧ 共 '+routes.length+' 条候选';ul.appendChild(li)}
}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp,l=.6+Math.random();
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,max:l,r:1.5+Math.random()*2.5,col})}}

// ========== 更新 ==========
function update(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const p of petals){p.x=(p.x+p.vx*dt)%size;p.y=(p.y+p.vy*dt)%size;p.r+=p.vr*dt}
  shake=Math.max(0,shake-dt*1.5);dDisp+=(danger-dDisp)*Math.min(1,dt*4);hurt=Math.max(0,hurt-dt*2);
  if(routeT>0){routeT-=dt;if(routeT<=0)$('rl').textContent=''}
  if(dlgT>0){dlgT-=dt;if(dlgT<=0)$('dlg').style.display='none'}
  if(state==='intro'){introT+=dt;if(introT>=2.4)state='play'}
  if(state==='win')winT+=dt;
  introK=state==='intro'?Math.max(.05,Math.min(1,(introT-1.1)/1.2)):1;
  if(state!=='play')return;
  time+=dt;invT-=dt;shieldT-=dt;speedT-=dt;freezeT-=dt;pl.dur=speedT>0?.1:.16;
  if(pl.to>=0){pl.t+=dt/pl.dur;
    if(Math.random()<.4){const[x,y]=pos(pl);parts.push({x,y,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,l:.5,max:.5,r:2,col:'255,80,100'})}
    if(pl.t>=1){pl.c=pl.to;pl.to=-1;pl.t=0;arrive()}}
  if(state!=='play')return;
  if(pl.to<0&&dirs.length){const k=dirs[dirs.length-1],[a,b]=D[k],r=(pl.c/N|0)+a,c=pl.c%N+b;
    if(r>=0&&r<N&&c>=0&&c<N&&adj[pl.c].includes(r*N+c)){pl.to=r*N+c;pl.t=0;steps++;step();if(b)face=b}}
  const chaseDur=Math.max(.2,.34-lvl*.015);
  for(const m of mons){
    if(freezeT>0)continue;if(m.stun>0){m.stun-=dt;continue}
    if(m.to>=0){m.t+=dt/m.dur;if(m.t>=1){m.prev=m.c;m.c=m.to;m.to=-1;m.t=0}}
    if(m.to<0){
      m.cd-=dt;if(m.cd>0)continue;
      const d=dist[m.c],ch=d>=0&&d<=5;
      if(ch&&!m.mode){bubble();if(dlgT<=0)say('……有东西在身后。快跑！',2)}
      m.mode=ch?1:0;let nx;
      if(ch){let best=1e9,o=[];for(const v of adj[m.c]){if(dist[v]<best){best=dist[v];o=[v]}else if(dist[v]===best)o.push(v)}nx=o[Math.random()*o.length|0];m.dur=chaseDur}
      else{let o=adj[m.c].filter(v=>v!==m.prev);if(!o.length)o=adj[m.c];nx=o[Math.random()*o.length|0];m.dur=.46;m.cd=Math.random()<.25?.5:0}
      m.to=nx;m.t=0;
    }
  }
  const[px,py]=pos(pl);let dm=99;
  for(const m of mons){const[mx,my]=pos(m);
    if(Math.hypot(mx-px,my-py)<cs*.5&&invT<=0&&shieldT<=0&&freezeT<=0){
      hp-=34;invT=1.6;hurt=1;shake=.6;m.stun=1.2;burst(px,py,18,'200,10,40',130);tone(160,.35,'sine',.3,60);say('唔…！好痛……',1.4);
      if(hp<=0){hp=0;finish(false);return}}
    const d=dist[m.c];if(d>=0&&d<dm)dm=d}
  danger=freezeT>0?0:Math.max(0,Math.min(1,1-(dm-1)/7));
  if(danger>.05){hbT-=dt;if(hbT<=0){beat();hbT=1.15-.75*danger}}
}

// ========== 绘制：萌系角色 ==========
function starP(x,y,R,r,n,rot){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n-Math.PI/2,d=i%2?r:R;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*d,y+Math.sin(a)*d)}ctx.closePath()}
function girl(x,y,s,t,moving){
  y+=Math.sin(t*(moving?14:3))*s*.03;const hurtE=invT>0||state==='dead';
  ctx.fillStyle='#ff8fc2';
  ctx.fillStyle='#cfc8e8';for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(x+k*s*.27,y+s*.02,s*.09,s*.2,k*.3+Math.sin(t*4+k)*.12,0,7);ctx.fill()}
  ctx.fillStyle='#4a1228';ctx.beginPath();ctx.moveTo(x-s*.12,y+s*.1);ctx.lineTo(x+s*.12,y+s*.1);ctx.lineTo(x+s*.19,y+s*.34);ctx.lineTo(x-s*.19,y+s*.34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c0173f';ctx.fillRect(x-s*.12,y+s*.1,s*.24,s*.05);
  ctx.fillStyle='#f6e4e4';ctx.beginPath();ctx.arc(x,y-s*.05,s*.24,0,7);ctx.fill();
  ctx.fillStyle='#cfc8e8';ctx.beginPath();ctx.arc(x,y-s*.07,s*.26,Math.PI,0);ctx.lineTo(x+s*.26,y-s*.02);
  for(let i=4;i>=0;i--)ctx.lineTo(x-s*.26+i*s*.13,y-s*.02+(i%2?s*.07:0));ctx.closePath();ctx.fill();
  const fx=face*s*.025;
  for(const k of[-1,1]){const ex=x+k*s*.095+fx,ey=y-s*.01;
    if(hurtE){ctx.strokeStyle='#4a3566';ctx.lineWidth=s*.025;ctx.beginPath();ctx.moveTo(ex-k*s*.04,ey-s*.04);ctx.lineTo(ex+k*s*.02,ey);ctx.lineTo(ex-k*s*.04,ey+s*.04);ctx.stroke()}
    else{ctx.fillStyle='#c8123a';ctx.beginPath();ctx.ellipse(ex,ey,s*.05,s*.07,0,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-s*.015,ey-s*.03,s*.02,0,7);ctx.fill();ctx.beginPath();ctx.arc(ex+s*.015,ey+s*.025,s*.01,0,7);ctx.fill()}}
  ctx.fillStyle='rgba(255,120,150,.5)';for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(x+k*s*.16+fx,y+s*.04,s*.04,s*.025,0,0,7);ctx.fill()}
  ctx.strokeStyle='#c4506e';ctx.lineWidth=s*.02;ctx.beginPath();if(hurtE)ctx.arc(x+fx,y+s*.1,s*.025,0,7);else ctx.arc(x+fx,y+s*.06,s*.04,.2,Math.PI-.2);ctx.stroke();
  ctx.fillStyle='#ff4f7e';starP(x-s*.2,y-s*.22,s*.07,s*.03,5,t);ctx.fill();
}
function ghost(x,y,s,m,t){
  const r=s*.3,fr=freezeT>0;y+=Math.sin(t*3+m.c)*s*.03;
  ctx.fillStyle=fr?'#9fcdee':m.mode?'#a3203f':'#5b4a8a';ctx.strokeStyle=fr?'#3a6a98':m.mode?'#3a0612':'#150a28';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y-s*.04,r,Math.PI,0);ctx.lineTo(x+r,y+r*.8);
  for(let i=0;i<3;i++)ctx.arc(x+r-(i*2+1)*r/3,y+r*.8,r/3,0,Math.PI);
  ctx.closePath();ctx.fill();ctx.stroke();
  for(const k of[-1,1]){const ex=x+k*r*.4,ey=y-s*.03;
    if(fr){ctx.strokeStyle='#3a6a98';ctx.beginPath();ctx.moveTo(ex-s*.04,ey);ctx.lineTo(ex+s*.04,ey);ctx.stroke()}
    else{ctx.fillStyle=m.mode?'#ffdd55':'#e8e0ff';ctx.beginPath();ctx.ellipse(ex,ey,s*.04,s*.055,0,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-s*.012,ey-s*.022,s*.015,0,7);ctx.fill();
      if(m.mode){ctx.strokeStyle='#1a0008';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-k*s*.05,ey-s*.09);ctx.lineTo(ex+k*s*.05,ey-s*.05);ctx.stroke()}}}
  ctx.fillStyle='rgba(255,120,150,.5)';for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(x+k*r*.62,y+s*.03,s*.035,s*.02,0,0,7);ctx.fill()}
  if(m.mode&&!fr){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x-s*.04,y+s*.07);ctx.lineTo(x+s*.04,y+s*.07);ctx.lineTo(x,y+s*.13);ctx.closePath();ctx.fill()}
}

function render(t){
  const sh=shake*10+dDisp*dDisp*3;
  ctx.save();ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  if(state==='win'){const z=1+Math.min(.15,winT*.12),[zx,zy]=ctr(EXIT);ctx.translate(zx,zy);ctx.scale(z,z);ctx.translate(-zx,-zy)}
  ctx.fillStyle='#0a0710';ctx.fillRect(-20,-20,size+40,size+40);
  ctx.drawImage(mazeCv,0,0,size,size);
  const[px,py]=pos(pl);let g;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(cs*.5|0)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  for(const o of items){const[x,y]=ctr(o.c),b=Math.sin(t*3+o.c)*cs*.04;
    g=ctx.createRadialGradient(x,y,0,x,y,cs*.36);g.addColorStop(0,'rgba(255,220,180,.7)');g.addColorStop(1,'rgba(255,120,120,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,cs*.36,0,7);ctx.fill();ctx.fillStyle='#000';ctx.fillText(IT[o.k][0],x,y+b)}
  for(const m of mons){const[x,y]=pos(m);ghost(x,y,cs,m,t)}
  ctx.globalAlpha=invT>0&&state==='play'&&Math.sin(t*40)>0?.4:1;girl(px,py,cs,t,pl.to>=0);ctx.globalAlpha=1;
  if(shieldT>0){ctx.strokeStyle='rgba(120,190,255,'+(.6+.3*Math.sin(t*8))+')';ctx.fillStyle='rgba(180,220,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,cs*.42,0,7);ctx.fill();ctx.stroke()}
  // 夜樱薄雾：紫色雾气 + 沿通道的暖粉灯光
  const R=cs*introK*(3.3+.1*Math.sin(t*6)+.05*Math.sin(t*3.1));
  dkx.globalCompositeOperation='source-over';dkx.fillStyle='rgba(5,2,10,.96)';dkx.fillRect(0,0,size,size);
  dkx.globalCompositeOperation='destination-out';dkx.globalAlpha=.34;dkx.fill(seenP);dkx.globalAlpha=1;
  dkx.save();dkx.clip(litP);
  g=dkx.createRadialGradient(px,py,cs*.2,px,py,R);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');
  dkx.fillStyle=g;dkx.fillRect(0,0,size,size);dkx.restore();
  ctx.drawImage(dk,0,0,size,size);
  ctx.save();ctx.clip(litP);ctx.globalCompositeOperation='lighter';
  g=ctx.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,'rgba(255,120,110,.22)');g.addColorStop(1,'rgba(255,90,90,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);ctx.restore();
  // 魔法阵（出口）
  const[ex,ey]=ctr(EXIT);ctx.save();ctx.translate(ex,ey);
  const col=hasKey?'255,90,120':'110,90,140';
  g=ctx.createRadialGradient(0,0,0,0,0,cs*1.1);g.addColorStop(0,'rgba('+col+','+(.55+.15*Math.sin(t*3))+')');g.addColorStop(1,'rgba('+col+',0)');
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(-cs*1.2,-cs*1.2,cs*2.4,cs*2.4);ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba('+col+',.95)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,cs*.4,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,0,cs*.33,0,7);ctx.stroke();
  starP(0,0,cs*.3,cs*.12,5,t*(hasKey?1.2:.25));ctx.stroke();
  if(!hasKey){ctx.fillStyle='#000';ctx.fillText('🔒',0,0)}
  ctx.restore();
  // 通关特效：冲击波 + 白光 + 魔法阵光屏
  if(state==='win'){
    [0,.3,.6].forEach(d=>{const u=winT-d;if(u>0&&u<1.6){ctx.strokeStyle='rgba(255,'+(110+u*70|0)+',110,'+(1-u/1.6)*.9+')';ctx.lineWidth=4*(1-u/1.6)+1;ctx.beginPath();ctx.arc(ex,ey,u*size*.75,0,7);ctx.stroke()}});
    if(winT<.4){ctx.fillStyle='rgba(255,225,190,'+.75*(1-winT/.4)+')';ctx.fillRect(-20,-20,size+40,size+40)}
    g=ctx.createRadialGradient(ex,ey,0,ex,ey,cs*3);g.addColorStop(0,'rgba(255,200,120,'+Math.min(.5,winT*.5)+')');g.addColorStop(1,'rgba(255,120,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,size,size)}
  // 幽灵鬼火：黑暗中远处的粉紫光点
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const m of mons){const d=dist[m.c];if(d<4||d>7)continue;const[x,y]=pos(m);
    g=ctx.createRadialGradient(x,y,0,x,y,cs*.4);g.addColorStop(0,m.mode?'rgba(255,60,60,.8)':'rgba(150,120,255,.6)');g.addColorStop(1,'rgba(190,160,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x-cs*.4,y-cs*.4,cs*.8,cs*.8)}
  ctx.restore();
  // 探路：星光路线
  if(routeT>0){ctx.save();ctx.globalAlpha=Math.min(1,routeT);
    for(let k=Math.min(routes.length,6)-1;k>=0;k--){const p=routes[k];
      ctx.strokeStyle=k?'rgba(160,120,200,.4)':'rgba(255,80,110,.9)';ctx.lineWidth=k?2:3;ctx.setLineDash([2,cs*.18]);ctx.lineCap='round';ctx.beginPath();
      p.forEach((n,j)=>{const[x,y]=ctr(n);j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
      if(!k){ctx.setLineDash([]);ctx.fillStyle='#ffd966';p.forEach((n,j)=>{if(j%2===0){const[x,y]=ctr(n);starP(x,y,cs*.12,cs*.05,4,t);ctx.fill()}})}}
    ctx.restore()}
  for(const p of parts){ctx.fillStyle='rgba('+p.col+','+Math.max(0,p.l/p.max)+')';starP(p.x,p.y,p.r*2.2,p.r*.8,4,p.l*4);ctx.fill()}
  ctx.fillStyle='rgba(150,15,40,.7)';
  for(const p of petals){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,7);ctx.fill();ctx.restore()}
  ctx.restore();
  // 粉色暗角 + 危险脉动
  g=ctx.createRadialGradient(size/2,size/2,size*.35,size/2,size/2,size*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  if(dDisp>.02){const pulse=.75+.25*Math.sin(t*(4+dDisp*8));
    g=ctx.createRadialGradient(size/2,size/2,size*.3,size/2,size/2,size*.78);g.addColorStop(0,'rgba(200,10,40,0)');g.addColorStop(1,'rgba(200,10,40,'+(.55*dDisp*pulse)+')');ctx.fillStyle=g;ctx.fillRect(0,0,size,size)}
  if(hurt>0){ctx.fillStyle='rgba(200,0,30,'+hurt*.45+')';ctx.fillRect(0,0,size,size)}
}
function hud(){
  $('hpf').style.width=hp+'%';$('hpt').textContent=hp;
  const b=[];if(shieldT>0)b.push('🛡️'+Math.ceil(shieldT));if(speedT>0)b.push('👟'+Math.ceil(speedT));if(freezeT>0)b.push('❄️'+Math.ceil(freezeT));if(hasKey)b.push('🔑');
  $('h3').textContent=b.join(' ');$('h1').textContent='第 '+lvl+' 关';$('h2').textContent=steps+' 步 · '+time.toFixed(1)+' 秒';$('bs').textContent='探路 R ×'+charges;
}

// ========== 输入 ==========
const K={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
addEventListener('keydown',e=>{const k=K[e.key];
  if(k){e.preventDefault();if(!dirs.includes(k))dirs.push(k)}else if(e.key==='r'||e.key==='R')scout()});
addEventListener('keyup',e=>{const k=K[e.key];if(k)dirs=dirs.filter(x=>x!==k)});
addEventListener('blur',()=>{dirs=[]});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!dirs.includes(k))dirs.push(k)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{dirs=dirs.filter(x=>x!==k)}))});
$('bs').onclick=scout;
$('bm').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.5;$('bm').textContent=muted?'🔇':'🔊'};

// ========== 主循环 ==========
let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;update(dt);render(ts/1000);hud();requestAnimationFrame(loop)}
build();
$('ov').style.display='none';$('ts').style.display='flex';
$('tb').onclick=()=>{audio();const t=$('ts');t.style.transition='opacity .7s';t.style.opacity=0;start();setTimeout(()=>{t.style.display='none';t.style.opacity=1;t.style.transition=''},750)};
requestAnimationFrame(loop);
</script>
